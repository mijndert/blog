<header>
  <nav aria-label="Main navigation">
    <div class="nav-brand">
      <div class="theme-picker" data-theme-picker>
        <button type="button" class="theme-toggle" aria-label="Theme" aria-expanded="false" aria-controls="theme-options">
          <span class="nav-dot" aria-hidden="true"></span>
        </button>
        <div class="theme-options" id="theme-options" hidden>
          {%- for theme in themes %}
          <button type="button" class="theme-swatch" data-theme-value="{{ theme.id }}" aria-label="{{ theme.label }}" style="--swatch-bg: {{ theme.bg }}; --swatch-accent: {{ theme.accent }};"></button>
          {%- endfor %}
        </div>
      </div>
      <a class="nav-name" href="/">{{ site.title }}</a>
    </div>
    <ul class="nav-links">
      {% for link in nav %}
        {% if link.url != "/" %}
        <li><a href="{{ link.url }}" {% if page.url == link.url %}aria-current="page"{% endif %}>{{ link.text }}</a></li>
        {% endif %}
      {% endfor %}
    </ul>
  </nav>
</header>
